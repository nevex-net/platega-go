version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    misspell:
      ignore-rules:
        # The API itself spells these fields this way.
        - comission
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: ^examples/
        linters: [gosec]

formatters:
  enable:
    - gofmt
